services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football-local-only}
    ports:
      - "5432:5432"
    volumes:
      - football_postgres:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-football_intelligence}
      PGUSER: ${POSTGRES_USER:-football}
      PGPASSWORD: ${POSTGRES_PASSWORD:-football-local-only}
    volumes:
      - ./sql/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        for file in /migrations/*.sql; do
          echo "Applying $${file}"
          psql -v ON_ERROR_STOP=1 -f "$${file}"
        done
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://football:${POSTGRES_PASSWORD:-football-local-only}@postgres:5432/${POSTGRES_DB:-football_intelligence}
    ports:
      - "${API_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-18000}
    ports:
      - "${WEB_PORT:-13000}:3000"
    depends_on:
      - api

volumes:
  football_postgres:

